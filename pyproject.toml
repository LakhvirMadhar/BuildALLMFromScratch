[project]
name = "buildingallmfromscratch"
version = "0.1.0"
description = ""
authors = [
    {name = "Lakhvir Madhar",email = "171702328+LakhvirMadhar@users.noreply.github.com"}
]

requires-python = ">=3.12"
dependencies = [
]

[tool.poetry]
package-mode = false

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
# pymupdf ships py.typed but leaves some functions unannotated
untyped_calls_exclude = ["pymupdf"]

[tool.ruff]
target-version = "py312"
line-length = 140
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "ANN", "RUF"]
ignore = [
    "N999",   # module names like 02_max_value.py are intentional
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.6,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "pymupdf (>=2.1,<3.0)"
]
